global_defs {
    script_security
}

vrrp_script chk_web {
    script "/usr/local/bin/check_web.sh"
    interval 3
    user root
}

vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 15
    priority 200
    advert_int 1

    unicast_src_ip 10.129.0.13
    unicast_peer {
        10.129.0.23
    }

    virtual_ipaddress {
        10.129.0.15/24
    }

    track_script {
        chk_web
    }
}
